<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traceur GPS — PHONE-01</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1d4ed8 0%, #0f172a 55%, #020617 100%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .panel {
      width: 100%;
      max-width: 380px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }
    .title {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .device-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.18);
      color: #93c5fd;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .pin-wrapper {
      margin: 34px auto 22px;
      display: flex;
      justify-content: center;
    }
    .pin-btn {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 14px 35px rgba(37, 99, 235, 0.45);
      transition: transform 0.2s ease, background 0.25s ease, box-shadow 0.25s ease;
    }
    .pin-btn:active {
      transform: scale(0.95);
    }
    .pin-btn.active {
      background: linear-gradient(145deg, #ef4444, #b91c1c);
      box-shadow: 0 14px 35px rgba(239, 68, 68, 0.45);
      animation: pulse 1.8s infinite;
    }
    .pin-btn svg {
      width: 50px;
      height: 50px;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.55); }
      70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .action-label {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .status-text {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .info-box {
      background: rgba(2, 6, 23, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 14px 16px;
      text-align: left;
      font-size: 0.88rem;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
    }
    .info-row + .info-row {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .info-label {
      color: #94a3b8;
    }
    .info-value {
      font-weight: 600;
      color: #f1f5f9;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1 class="title">Suivi Position</h1>
    <div class="device-badge">PHONE-01</div>

    <div class="pin-wrapper">
      <button id="toggleBtn" class="pin-btn" aria-label="Démarrer ou arrêter le suivi">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
        </svg>
      </button>
    </div>

    <div id="actionLabel" class="action-label">Appuyer pour démarrer</div>
    <div id="statusText" class="status-text">En veille</div>

    <div class="info-box">
      <div class="info-row">
        <span class="info-label">Coordonnées</span>
        <span id="coordsVal" class="info-value">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Précision</span>
        <span id="accVal" class="info-value">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Dernier envoi</span>
        <span id="timeVal" class="info-value">—</span>
      </div>
    </div>
  </div>

  <script>
    const DEVICE_ID = "PHONE-01";
    const TOPIC = `flotte/positions/${DEVICE_ID}`;
    const BROKER_WSS = "wss://broker.emqx.io:8084/mqtt";

    const toggleBtn = document.getElementById("toggleBtn");
    const actionLabel = document.getElementById("actionLabel");
    const statusText = document.getElementById("statusText");
    const coordsVal = document.getElementById("coordsVal");
    const accVal = document.getElementById("accVal");
    const timeVal = document.getElementById("timeVal");

    let isRunning = false;
    let client = null;
    let watchId = null;

    function stopTracking() {
      isRunning = false;
      if (watchId !== null && "geolocation" in navigator) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      if (client) {
        client.end(true);
        client = null;
      }
      toggleBtn.classList.remove("active");
      actionLabel.textContent = "Appuyer pour démarrer";
      statusText.textContent = "Arrêté";
    }

    function startTracking() {
      if (!("geolocation" in navigator)) {
        statusText.textContent = "GPS non disponible sur ce navigateur";
        return;
      }

      isRunning = true;
      toggleBtn.classList.add("active");
      actionLabel.textContent = "Appuyer pour arrêter";
      statusText.textContent = "Connexion au réseau...";

      client = mqtt.connect(BROKER_WSS, {
        clientId: "phone-01-" + Math.random().toString(16).slice(2, 10)
      });

      client.on("connect", () => {
        if (!isRunning) return;
        statusText.textContent = "Transmission active";

        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            if (!isRunning) return;
            const lat = Number(pos.coords.latitude.toFixed(6));
            const lng = Number(pos.coords.longitude.toFixed(6));
            const acc = Math.round(pos.coords.accuracy);

            coordsVal.textContent = `${lat}, ${lng}`;
            accVal.textContent = `± ${acc} m`;
            timeVal.textContent = new Date().toLocaleTimeString();

            const payload = {
              device_id: DEVICE_ID,
              lat: lat,
              lng: lng
            };

            if (client && client.connected) {
              client.publish(TOPIC, JSON.stringify(payload));
            }
          },
          (err) => {
            statusText.textContent = `Erreur GPS (${err.code})`;
          },
          {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 15000
          }
        );
      });

      client.on("error", () => {
        statusText.textContent = "Erreur de connexion";
      });
    }

    toggleBtn.addEventListener("click", () => {
      if (isRunning) {
        stopTracking();
      } else {
        startTracking();
      }
    });
  </script>
</body>
</html>
