<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte de Suivi — Flotte</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body, #map {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .hud {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      min-width: 230px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      color: #f8fafc;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      font-size: 0.9rem;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }
    .dot.connected {
      background: #22c55e;
    }
    .meta {
      font-size: 0.84rem;
      color: #cbd5e1;
      line-height: 1.65;
    }
    .meta strong {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="hud">
    <div class="status-row">
      <span id="statusDot" class="dot"></span>
      <span id="statusLabel">Déconnecté</span>
    </div>
    <div class="meta">
      <div>Appareil : <strong id="hudDevice">—</strong></div>
      <div>Position : <strong id="hudCoords">—</strong></div>
      <div>Mise à jour : <strong id="hudTime">—</strong></div>
    </div>
  </div>

  <script>
    const BROKER_WSS = "wss://broker.emqx.io:8084/mqtt";
    const TOPIC_WILDCARD = "flotte/positions/+";

    const DEVICE_STYLES = {
      "PHONE-01": { color: "#2563eb", label: "Téléphone" },
      "ESP32-01": { color: "#ea580c", label: "ESP32" }
    };

    const map = L.map("map", { zoomControl: true }).setView([-18.8792, 47.5079], 15);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const tracks = {};
    let hasCentered = false;

    const statusDot = document.getElementById("statusDot");
    const statusLabel = document.getElementById("statusLabel");
    const hudDevice = document.getElementById("hudDevice");
    const hudCoords = document.getElementById("hudCoords");
    const hudTime = document.getElementById("hudTime");

    const client = mqtt.connect(BROKER_WSS, {
      clientId: "map-viewer-" + Math.random().toString(16).slice(2, 10)
    });

    client.on("connect", () => {
      statusDot.classList.add("connected");
      statusLabel.textContent = "Connecté";
      client.subscribe(TOPIC_WILDCARD);
    });

    client.on("offline", () => {
      statusDot.classList.remove("connected");
      statusLabel.textContent = "Hors ligne";
    });

    client.on("message", (_topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        const id = data.device_id;
        const lat = Number(data.lat);
        const lng = Number(data.lng);
        if (!id || Number.isNaN(lat) || Number.isNaN(lng)) return;

        const style = DEVICE_STYLES[id] || { color: "#16a34a", label: id };
        const latLng = [lat, lng];
        const nowStr = new Date().toLocaleTimeString();

        if (!tracks[id]) {
          const marker = L.circleMarker(latLng, {
            radius: 9,
            color: "#ffffff",
            weight: 2.5,
            fillColor: style.color,
            fillOpacity: 0.95
          }).addTo(map);

          const polyline = L.polyline([latLng], {
            color: style.color,
            weight: 4,
            opacity: 0.85
          }).addTo(map);

          tracks[id] = { marker, polyline };
        } else {
          tracks[id].marker.setLatLng(latLng);
          tracks[id].polyline.addLatLng(latLng);
        }

        tracks[id].marker.bindPopup(
          `<strong>${id}</strong> (${style.label})<br>${lat.toFixed(6)}, ${lng.toFixed(6)}<br>MAJ : ${nowStr}`
        );

        hudDevice.textContent = id;
        hudCoords.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        hudTime.textContent = nowStr;

        if (!hasCentered) {
          map.setView(latLng, 17);
          hasCentered = true;
        }
      } catch (_err) {
        // Ignore les trames non JSON
      }
    });
  </script>
</body>
</html>
